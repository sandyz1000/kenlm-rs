[package]
name = "kenlmrs"
version = "0.0.1"
authors = ["Sandip Dey <sandip.dey1988@yahoo.com>"]
edition = "2021"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.23.0"
thiserror = "2.0.18"
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"
flate2 = "1"

[dev-dependencies]
miette = { version = "7.6.0", features = [
    "fancy",
] } # optional but gives nicer error messages!
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "scoring"
harness = false
